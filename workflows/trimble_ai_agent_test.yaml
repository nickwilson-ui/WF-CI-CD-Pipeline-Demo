a6fd6bc","text":"Get case details","value":"4c4db9b4-5b71-5539-9be4-82015a6fd6bc","imageName":"us-docker.pkg.dev/stackpulse/public/torq_cases/get-case","icon":"https://cdn.torq.io/vendors/torq_cases_case_lifecycle.svg","stepDescription":"Returns the details of the case with the given case ID.","integrationRequired":false}]'
